# ScheduleGod AI — full stack: database + backend + frontend.
#
#   docker compose up --build          # build and boot everything
#   docker compose down                # stop
#
# Host ports are configurable so this works even when 8000/3000 are taken:
#   BACKEND_PORT=8011 FRONTEND_PORT=3011 docker compose up --build
#
# To use live Muse Spark (optional; defaults to the deterministic mock),
#   MODEL_API_KEY=... docker compose up --build

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: schedulegod
      POSTGRES_PASSWORD: schedulegod
      POSTGRES_DB: schedulegod
    volumes:
      # Postgres 18 image: PGDATA lives under /var/lib/postgresql/18/docker,
      # so mount the volume at /var/lib/postgresql (not .../data as in <=17).
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulegod -d schedulegod"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://schedulegod:schedulegod@db:5432/schedulegod
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MUSE_API_KEY: ${MUSE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data: